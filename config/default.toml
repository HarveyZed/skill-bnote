
# bnote 默认配置。任何一项都可以被 config/local.toml 或环境变量 BN_<SECTION>_<KEY> 覆盖。
# 环境变量优先级： env > local.toml > default.toml
# 例： BN_MEDIA_MAX_HEIGHT=720 BN_FRAMES_FPS=1 BN_SEGMENT_STABLE_MIN_SEC=2.0

[paths]
# 数据根。解析顺序： BNOTE_ROOT 环境变量 > 本项 > <当前工作目录>/.bnote
# 默认**不是绝对路径**：skill 装到哪台机器都能跑，数据跟着调用时的工作目录走。
root           = ""
state_dir      = ""            # state/<vid>/ 跨集沉淀（术语表、画像、登录态）；删 cache 不带走
cache_dir      = ""            # cache/<vid>/ 中间产物（可随时删）
out_dir        = ""            # out/<vid>/  最终交付（Markdown/图片）；内部结构冻结
log_dir        = ""            # logs/
# 契约模板目录（写作 prompt 模板与 schema）。相对 **skill 根**，属于 skill 资产，可外置。
contracts_dir  = ""            # 留空 = <skill 根>/references/contracts
keep_cache     = true          # 跑完是否保留 cache（false 时 bundle 后自动删帧）

[tools]
# 解释器：venv 不随 skill 走，换机器请指向该机的 python（BN_PYTHON 可覆盖）
python         = "python3"
# 外部程序；留空 = 自动探测（PATH -> imageio-ffmpeg 内置静态包）
ffmpeg         = ""
ffprobe        = ""
yt_dlp         = ""            # 留空 = 用当前 python 的 yt_dlp 模块

[auth]
# 可选：B 站登录态。三种写法任选
#   1) Netscape cookies.txt 路径
#   2) 纯文本文件，内容形如 SESSDATA=xxxx
#   3) 环境变量 BN_AUTH_SESSDATA
cookie_file    = ""

[meta]
# L1 元信息：除标题/时长/cid 外，还落盘 简介 / 标签 / 分区 / aid / UP 主置顶评论
# 置顶评论只取 UP 置顶的那一条（data.upper.top），不做评论区批量采集：
# 作者常把资料链接、勘误、答疑补充在置顶评论里——改简介等于重新发布视频，所以更愿意动这里。
# 注意：取评论前要先请求一次视频页拿到 buvid3，缺了它评论接口会被风控挡回 HTTP 412。
top_comment    = true          # false = 完全不请求评论接口（少两次 HTTP 请求）
top_comment_timeout = 20       # 单次请求超时（秒）

[media]
max_height     = 1080          # 720 更快，1080 更适合读 PPT 小字
format         = ""            # 留空 = 自动: bv*[height<=H]+ba/b[height<=H]
audio_only     = false         # true = 只下音轨(m4a)，供 ASR 用
sections       = ""            # 例 "00:05:00-00:20:00"，只下片段（试跑用）
keep_video     = true          # 抽帧后是否保留 mp4
retries        = 3
sleep_requests = 1.0           # 每个请求间隔，防风控
concurrent     = 1
proxy          = ""

[subtitle]
# 按顺序尝试；失败的自动跳到下一个
backends       = ["bili", "file", "whisper"]
# 字幕轨优先级（正则，按序匹配 lan 字段）
lang_priority  = ["ai-zh", "zh-Hans", "zh-CN", "zh", "en"]
file_path      = ""            # backend=file 时使用的 srt/ass/json
# 注意：优先用 B 站官方 AI 字幕（需登录态：bnote auth login）。Whisper 是兜底，
# 讲课类音频用 small 会明显出别字，建议至少 medium。
min_coverage   = 0.8           # 覆盖度下限：max(to)/时长 低于此值判为残轨，继续试下一个后端
max_coverage   = 1.2           # 覆盖度上限：高于此值说明时间轴超出片长（疑似整段轨/串 P），同样换后端
auto_retry_partial = true      # 缓存里的轨覆盖度不达标时，重跑是否自动重试一次（false = 缓存永远优先，只能 --force 重取）
whisper_model  = "medium"      # tiny/base/small/medium/large-v3
whisper_device = "cpu"         # 沙箱内无 GPU；有 GPU 时可改 cuda
whisper_compute= "int8"
whisper_beam   = 1
whisper_vad    = true
whisper_threads= 16
whisper_lang   = "zh"
whisper_prompt = ""            # 可填术语表，引导识别（如 "FDE, 提示词工程, RAG, Agent"）

[frames]
fps            = 2             # 抽帧频率；2fps 足够刻画幻灯片节奏
scale_height   = 720           # 抽帧后缩放高度（0=不缩放）
crop           = ""            # ffmpeg crop 参数 "w:h:x:y"，用于裁掉摄像头/侧栏
jpg_quality    = 3             # ffmpeg -q:v，2~5
region         = [0.0, 0.0, 1.0, 1.0]   # 参与"稳定性判定"的画面区域 [l,t,r,b]（相对坐标），默认全画面

[overlay]
# M3 遮挡区识别（bnote overlay）：从**已抽出的帧**里认出"不是幻灯片内容"的那几块像素 →
# cache/<vid>/overlay.json（区域 + 判据 + 置信 + 适用性；**不落逐帧掩码**、不含时间戳）。
# 两类判据：① band_change_rate（底部烧录字幕条，含按行剖面拟合带）
#           ② corner_static_glyphs（角状外物：标注工具条 / 水印 / 进度条 / 鼠标）
# 消费方：切片（挖掉遮罩后算帧差/墨迹/清晰度/送 OCR 的图）与量测（motion/freeze 用哪些像素）。
# 注意：字幕带判据的三条旧参数**沿用 [segment] 的同名键**（caption_strip_ratio /
#       caption_band_multiple / diff_threshold）——同一份语义只能有一个真源，不在这里抄。
enabled               = true   # false = 不产出 overlay.json，消费方退化为全画面（旧行为）
frames_min            = 24     # 帧数少于它写 applicability=insufficient（不静默返回空）
caption_band_top_limit = 0.45  # 字幕带搜索窗：只能落在画面下方这么多以内（防把正文当字幕）
caption_rate_min      = 0.15   # 带变化率下限（沿用旧实现的字面阈值 0.15）
caption_min_rows      = 2      # 拟合出的带至少这么多行（低分辨率行）
caption_row_multiple  = 2.5    # 带内变化率相对"内容区"的倍数门槛（配合 +0.08 的绝对增量）
caption_row_gap       = 0      # 允许带内出现几个低变化行（多行字幕留缝；0 = 不允许）
# 角状外物判据（corner_static_glyphs）**默认关闭**：它在 6 集实测样本上要么漏（p20 的工具条
# 只闪现 3 帧、p21 只有 8 帧）、要么误（阈值放宽到 5 档色调时 p20 会把左上角 0.30x0.30
# 的幻灯片标题区当成工具条挖掉），而且逐帧近全分辨率量色块很贵（实测每集 +60~290 s）。
# 想试就把它打开，并看清 overlay.json 里每条区域的 color_patches / present_frames /
# frame_count —— 那三个数就是"这条区域该不该采信"的依据。
widget_enabled        = false  # 是否启用角状外物判据
widget_zone           = 0.30   # 角状外物的搜索窗边长（占画面宽/高的比例，四角各一个）
widget_changed_max    = 0.05   # 逐像素"变过的帧对比例"上限（帧间几乎不变）
widget_samples        = 40     # 每个角留几个候选帧做全分辨率证据（先按低分辨率梯度预筛，                               # 工具条是闪现的：等间隔抽样必然漏，见 overlay.py 模块头）
widget_pad            = 0.008  # 收紧方框后向外放宽的比例（占搜索窗边长）
widget_min_area       = 0.004  # 候选区域面积下限（占整幅）
widget_max_area       = 0.09   # 面积上限（太大就不是角状外物了）
widget_edge_min       = 0.03   # 全分辨率梯度密度下限（有细小字符）
widget_color_min      = 6      # 显著色块色调档数下限（有彩色色块；**两条都要满足**：
                               # 幻灯片表格的梯度比工具条更高，只看梯度会把表格挖掉）

# —— M4 新增：手写笔迹（判据实现在 segmenters/framesig.py 的 stroke_mask，这里只放参数）——
# 彩色细笔画 = 手写笔迹 → overlay.json 的 handwriting 区域。**只用于把它从 OCR 与帧差/墨迹里
# 排除，交付图里照旧保留笔迹**。消费方（stable 的签名 / ocr 的送识别图）按这些参数**逐帧**
# 重算笔画掩膜，**不是**按 box 整块挖（笔迹逐帧移动、累积，整块挖会伤其余页同位置的正文）。
# 判不出来时 applicability=insufficient（跑 bnote slides 时会打印一行）。
handwriting_enabled   = true   # false = 不做手写判定（消费方退化为把笔迹当正文内容）
handwriting_stride    = 2      # 产区域时每隔几帧量一次（区域只是审计范围，消费方按帧现算）
# **区域激活门槛**（M4b 调过一次）：零星几十个饱和像素不是手写。实测（320 宽尺度、隔帧采样）
#   真有手写的集达到 0.001 的帧数：p22 552、p23 269、p21 200、p20 52；
#   而 P51/P52（WPS 编辑器 / 阿里云控制台 / Windows 桌面录屏，逐帧看过）最高单帧只有
#   0.0019/0.0018，达到 0.001 的只有 2/3 帧 —— 抬到 0.001 且至少 5 帧才产区域，
#   这两集就不再凭空产出一条 handwriting 区域（chosen 回到 main 基线）。
#   代价：只有零星笔迹的集也不再产区域（p24 最大 0.00075）。
handwriting_min_frac  = 0.001  # 单帧笔画像素占比达到它才算"这帧有笔迹"
handwriting_min_frames= 5      # 至少这么多帧命中才产出一条区域
handwriting_pad       = 0.01   # 包围盒外扩（占画面比例）
handwriting_sat_min   = 0.45   # 饱和度下限（笔画是饱和色，印刷灰字不是）
handwriting_val_min   = 0.35   # 亮度下限（排除暗色块）
handwriting_hue_max   = 45.0   # 暖色窗下界：h <= 此值（红/橙笔）
handwriting_hue_min   = 320.0  # 暖色窗上界：h >= 此值（红笔的另一侧）
handwriting_blue_min  = 0.0    # 蓝窗：0/0 = 关闭。**实测据**：幻灯片自身的蓝色标题字与青色块
handwriting_blue_max  = 0.0    #   会被一起涂白（p22 002501 的蓝色小标题），伤正文，所以默认关
handwriting_light_min = 0.80   # 笔迹邻近背景的亮度下限（笔写在浅底上）。M4b 从 0.55/0.65 收到
                                #   0.80 的依据：桌面壁纸/网页深色区/IDE 主题的局部亮度都低于它，
                                #   那里的饱和像素是图标与 UI（实测桌面帧 0.0049→0.00009），
                                #   而幻灯片红笔只掉 30%~80%、OCR 对照结论不变
# 判据是"**笔画 vs 实心色块**"，按**厚度**分（不是按面积/密度）：
#   对饱和掩膜做 handwriting_block_erode 次 4 邻域腐蚀，还活着的像素说明它所在连通域两个方向
#   都至少有 2k+1 像素厚 → 那是红底白字条 / 填充的流程框；核再膨胀 k+1 圈圈住整块，整块**不涂白**。
#   **为什么不按滑窗密度**（上一版做法，已废弃）：白字把色块挖空，字周围的色块密度不够，会被
#   当成笔画涂白 → 白字变白底白字，OCR 直接丢字（实测 p22"平滑指数：10.00"整行消失、被红笔圈住
#   的 0.67 被读成 0.07）。实测厚度：红底白字条 5 px（腐蚀 3 次剩 31 px）、"Rerank" 填充框同类；
#   而红笔笔画腐蚀 1 次就没了 —— 所以 k=3 分得开。
handwriting_block_erode  = 3    # 判"实心色块"的腐蚀次数（320 宽分析尺度；笔画 1 次就没了）
handwriting_block_pad    = 3    # 色块核之外再多保护几圈：pad=1 时"平滑指数：10.00"尾字仍被啃掉，
                                #   pad=3 才完整读回，而红笔伪文字（一大/粗筛）照样清得掉
handwriting_ink_max      = 0.62 # 深色印刷字阈值（沿用 segment 墨迹口径）：最后那一圈膨胀不许长进
                                #   这些像素，免得把笔划过的数字啃掉（0.67 → 0.07 就是这个坑）
handwriting_bg_window    = 15  # 判"邻近背景亮不亮"的滑窗边长

[roles]
# M4b：整屏应用/录屏（app_screen）判据 —— 判据与默认值在 bnote/segmenters/framesig.py 的
# APP_DEFAULTS（唯一真源），这里只是可覆盖的副本。**app_screen 仍是整屏内容，整页优先照旧可作
# 主图**；它唯一的特别之处是**不走手写涂白**（IDE/浏览器/终端里没有手写，彩色 UI 被当成彩色笔画
# 只会伤 OCR 与帧差 —— P51/P52 实测 chosen 因此漂移 10/27 与 3/14 段）。
# 实测（320 宽尺度，16 张标注帧）：APP fg 0.018~0.028 / bands 13~23 / run 1~2；
#                                课件 fg 0.017~0.279 / bands 4~9   / run 1~4。
app_fg_max          = 0.032  # ① 前景像素占比上限（UI 大半个屏是背景）
app_bands_min       = 12     # ② 行带数下限（代码/文件树/终端行很多）
app_run_max         = 2.0    # ③ 前景水平游程中位数上限（UI 字更小）
app_border_min      = 0.0    # ④ 边带前景占比下限：默认 0（不参与判定）——浏览器页页边距也干净
                             #   （0.007~0.017），而带红笔的课件反而 0.39~0.53，它只作记录值
app_gap             = 0.20   # 与底色差多少算前景
app_border_band     = 0.04   # 边带宽度（只用于记录值）
# M4 帧角色（bnote/layers/roles.py）：把**已抽出的帧**判成六个角色之一，供切片层实现
# "整页优先"选帧（段内只要存在可当主图的候选 —— full_page 或 app_screen —— 就不能选别的）。
# 输入只用已抽出的帧 + overlay.json（遮挡区从统计里排除）+ 本批帧自己算出的笔画中位数，
# **不新增解码**；判据名与关键数字逐帧写进 segments.json / slides.json 的 role_evidence。
# 判不出就给**低置信**的 full_page（见 roles.py 的说明），不硬判。
enabled             = true   # false = 不做角色判定（segments.json 不写 role，check 只 warn）
analyze_width       = 160    # 判据分析宽度（判据都在这个尺度上量，省时间且与分辨率无关）
stroke_width        = 320    # 笔画尺度量测宽度（比分析宽度细，量化"字有多大"）
blank_std_max       = 0.02   # 灰度标准差 <= 它判 blank（近纯色/黑场）
blank_white_min     = 0.995  # 近全白占比 >= 它判 blank
blank_fg_max        = 0.004  # 前景像素占比 <= 它判 blank（与明暗主题无关的那条）
letterbox_min       = 0.10   # 黑边总宽下限（上下或左右），配合下一项取较大者
letterbox_delta     = 0.30   # 黑边要**比本集中位数多**这么多才算插播。为什么不取 0.1：
                             #   深色主题（p46/BV1CC 这种黑底课件）的"黑"会被逐行/逐列黑边判据吃掉
                             #   一大片，0.1 时实测 p46 有 67/173 张候选帧被误判成 insert
                             #   （bars_total 0.97~1.56，而该集中位数 0.72）；0.3 只留"黑边明显更多"的帧
letterbox_window_min= 0.25   # 黑边之外的内容窗口亮度下限：区分"插屏黑边"与"深色主题自身的黑"
                             #   （实测 p46 黑底课件页窗口均值 0.05~0.12，真正的插屏黑边外是另一幅亮画面）
presenter_skin_min  = 0.05   # 肤色像素占比下限（出镜帧的正面证据）
presenter_mode_max  = 0.35   # 亮度直方图峰占比上限：照片没有成片底色，幻灯片有（关键那条）
zoom_stroke_multiple= 8.0    # 笔画尺度 >= 本批中位数的多少倍才算"页内放大截图"
zoom_mode_min       = 0.40   # 放大截图仍要有成片底色
zoom_content_min    = 0.55   # 内容包围盒面积下限（放大到满屏）
zoom_border_min     = 0.25   # 内容顶到画面边缘的比例下限（放大截图没有页边距）
fullpage_mode_min   = 0.45   # 底色成片（直方图峰占比）下限 —— 白底/灰底/深底都适用
fullpage_fg_min     = 0.01   # 前景像素占比下限（有字/有图才算一页）
fullpage_edge_min   = 0.004  # 梯度密度下限（有笔画才算一页）
fg_gap              = 0.20   # 与底色差多少才算前景像素
ink_dark_max        = 0.62   # 墨迹阈值（沿用 segment 的口径）
stroke_gap          = 0.15   # 笔画量测的深色阈值相对本帧中位数下移多少
light_threshold     = 0.70   # light_frac 的阈值（只作记录：判据一律与明暗主题无关）
# M4b「遮挡最少」换帧的开关：**默认 false（关闭）**。
# 判据本身**保留**——roles._occlusion 照旧逐帧算最大连通前景块占比，与 role_evidence 一起写进
# 候选表（segments.json / slides.json），可查可复核；只是不参与选帧。
occlusion_swap      = false  # 为什么默认关（唯一真实样本上判错方向）：
                             #   15 集语料里这条判据只触发过一次 —— p23 段 11（621.5–722.5 s），
                             #   把 001404 换成了 001244。逐帧目视复核：
                             #     * 001404（判 occlusion 0.752，得分 177.54）：**完整渲染**的一页
                             #       （「充分利用工具和技术 / 01 善用大模型 / 02 善用评估框架」），
                             #       页面上只有一个小鼠标箭头；
                             #     * 001244（判 occlusion 0.504，得分 165.25）：**淡入中的半渲染帧**
                             #       —— 右栏白字几乎不可见、左栏整体发灰。
                             #   也就是说判据把**幻灯片自己的深色面板**当成前景块、把淡入帧当成
                             #   "少遮挡"，结论与"哪张更完整"正好相反。
                             # true = 恢复 M4b 的换帧行为，配合 [segment].occ_score_tol /
                             #   occ_min_gain 两个门槛；那两项只在开关打开时才生效。

[measure]
# M1 媒体验测（bnote measure）：**一次解码**同时出切点/冻结段/静音段/逐秒运动，零 token。
# 只读媒体文件 + cache/frames/index.json（外加可选的 cache/<vid>/overlay.json），
# 产物 cache/<vid>/measure.json（不含时间戳，可逐字节比对）。
# 注意：**不引入 signalstats**（实测占整链 92% 墙钟），所以 motion 只反映画面变化量、不含色彩统计。
# M3 起**按遮罩算**：有 overlay.json 就给同一条滤镜链加 drawbox=...:t=fill 把遮挡区涂掉
# （不额外解码）；拿不到时按全画面算，并在产物的 applicability 里写明 masked=false。
enabled            = true     # false = 整个量测能力关闭（bnote measure 直接跳过）
scdet_threshold    = 8.0      # ffmpeg scdet 的硬切阈值（只影响它自己打的 lavfi.scd.time，M1 用逐帧 score）
cut_score_min      = 8.0      # 切点口径：lavfi.scd.score >= 该值的帧即切点（实测阈值不敏感：>3 得 7、>8 得 6）
freeze_noise_db    = -60      # freezedetect 的噪声容限（dB）
freeze_min_sec     = 0.5      # freezedetect 的最短冻结时长
silence_noise_db   = -35      # silencedetect 的静音门限（dB）
silence_min_sec    = 0.5      # silencedetect 的最短静音时长

[sample]
# M5 取样包（bnote sample）：判型与信息流画面旁证用的「少量窗口取样帧」。
# 一次 yt-dlp 下载若干短窗口 → ffmpeg 定频抽帧 → cache/<vid>/sample/（**私有根**：
# 绝不写 cache/<vid>/media/、cache/frames/index.json 或顶层 overlay.json / measure.json）。
# 只由显式 bnote sample 触发；enabled 是给未来自动路径预留的（显式命令不受它拦，同 [sheet]）。
enabled              = false  # true 才允许未来自动路径跑；显式 bnote sample 不受此拦
window_sec           = 30.0   # 每个取样窗口的秒数（20–60；片长更短则退化成整段一个窗口）
window_anchors       = [0.10, 0.50, 0.90]  # 片头 / 中段 / 片尾的锚点（取窗口起点、夹取到片长内）
fps                  = 1.0    # 取样抽帧频率（判型只要形态；比整片 2fps 省一半以上）
scale_height         = 720    # 取样帧缩放高度（0 = 不缩放）
max_height           = 720    # 取样下载的画质上限（比整片低一档，省流量）
keep_parts           = true   # 成功后是否保留各窗原始分片 sample/media/wNN/（false = 只留拼好的 sample_video.mp4）
dur_tol_sec          = 0.5    # 拼接实测时长与「请求窗口之和」的容差（yt-dlp 多段是分别下载再拼接）
first_frame_tol_sec  = 1.0    # 每个窗口首帧 t 与窗口起点的容差（应 >= 1/fps）

[sheet]
# M2 读字面板（bnote sheet）：把若干帧拼成一张**只烧序号**的索引图 →
# out/<vid>/_meta/sheets/<name>.png + out/<vid>/_meta/sheet.json（行列→帧→t 的权威映射只在 JSON 里）。
# 铁律：**面板里的字一律不采信**（面板是缩放拼图，只当"这里有东西"的索引）；
#       要读字必须用 bnote frames --read 取全分辨率单帧。
# enabled / inline 是给「自动生成 / 写手引用」的开关 —— M2 里没有任何自动路径：
#       用户显式敲 bnote sheet 就是要它跑，**不受 enabled 拦**（默认 false 也不影响手动使用）。
enabled            = false      # 是否允许自动/流水线生成面板（预留给 M5：信息流画面旁证、判型 T3）
inline             = false      # 【0.14.0 起在信息流模式不再生效】写手可引的图改成插图（见 [figures].inline）；面板只是材料
preset             = "620x170"  # 单格包围盒：500x140 / 620x170 / 760x210（格宽按源帧长宽比反推）
cols               = 3          # 每张面板的列数
rows               = 4          # 每张面板的行数（cols*rows = 每张吃几个候选）
blank_std_max      = 0.02       # 一格的标准差低于该值判为空白格并跳过（**不占序号、不补位**）
max_sheets         = 8          # 整集上限（--max 会被夹到 max_sheets*cols*rows）
max_per_chapter    = 2          # 每章上限（预留给 M5 的自动路径；M2 手动调用不受它拦）
max_stream         = 4          # 信息流旁证上限（预留给 M5）

[figures]
# 0.14.0 单帧插图（bnote figures / bnote stream --with-vision）：从取样包每个窗口挑"关键时刻"，
# 抽**全分辨率单帧**（复用 M2 的 frames.read_frame：缓存帧已是原生尺寸就复用，否则从整片媒体现抽
# PNG 无损）→ out/<vid>/_meta/figures/NN.png + _meta/figures.json（t / 来源帧 / size / sha256 / 一句理由）。
# 与 [sheet] 的分工：**面板是给写手看的材料**（缩放拼图，字一律不采信）；**插图才是可引用的图**（单帧）。
# enabled / inline 的口径同 [sheet]：显式 bnote figures 不受 enabled 拦（显式命令就是要它跑）；
# bnote stream --with-vision 视为打开 enabled（它本来就是"要画面旁证"的显式 opt-in）。
enabled            = false      # 是否允许自动/流水线生成插图候选（显式 bnote figures 不受拦）
inline             = false      # 是否允许写手在正文里引用插图 ../_meta/figures/NN.png
max_per_video      = 4          # 整集上限：候选张数（超过按窗口顺序截断）与引用配额 warn 都用它
min_change         = 0.02       # 窗口内"显著画面变化"的下限（相邻取样帧的归一化平均绝对差）；低于它取窗口中点帧
diff_size          = [32, 18]   # 算帧差用的缩略尺寸（宽 x 高，灰度）——只为比大小，不读字
dedup_hamming      = 6          # 跨窗口去重的汉明距离阈值（0–64）：候选帧的 8×8 dHash 与**已入选**的任一候选相差 <= 此值即判为同一画面、跳过。0 = 不去重；调大更狠。被跳过的候选连 t/window/dHash/hamming/dup_of 一起记进 figures.json 的 skipped（可审计，不静默丢弃）

[segment]
strategy            = "stable"  # stable(默认，稳定态+终态收敛) | scene(基线对照)
stable_min_sec      = 1.5       # 连续低于阈值的时长达到该值才算"一页讲完"
diff_threshold      = 0.035     # 归一化帧差阈值；越小越敏感
diff_alpha          = 0.5       # 帧差构成： alpha*dHash汉明率 + (1-alpha)*像素平均绝对差
min_seg_sec         = 4.0       # 短于该时长的段直接并入相邻段
merge_hash_dist     = 6         # 相邻段终态 dHash 汉明距离 <= 此值判定为"同一页"（整体重绘但内容相同）
merge_max_gap_sec   = 30.0      # 合并的时间间隔上限（注意：段是连续切分的，gap 恒为 0，此值只作保险）
merge_max_span_sec  = 240.0     # 单页累计时长上限，防止链式合并把整段视频并成一页
merge_gram_contain = 0.45       # 终态 OCR 文本的 **4-gram 包含度** >= 此值才判为"同一页的不同阶段"（v0.7.2）
                                # 为什么不用字符集包含度：同套 PPT 的页眉/标题栏/“幻灯片第N张”等样板字
                                # 会让任意两页的字符集包含度都在 0.5-0.9（实测 p24 两张完全不同的页达到 0.88），
                                # 于是"同页"误判把一页内容并掉。4-gram 实测同页 0.53、异页 ≤0.31，可分。
merge_text_contain = 0.85       # （已弃用，保留仅为兼容旧配置）字符集包含度阈值
merge_text_min_chars = 16       # 参与包含度判定的文本至少这么长（讲者手写标注页很短，40 会漏合并）
merge_additive      = true      # 用"增量绘制"判据识别同页动画（新元素画在原本空白处）
additive_changed_max= 0.6       # 变化区域占比超过该值视为整页重绘（换页）
additive_old_ink_max= 0.12      # 变化区域内原本的墨迹比例低于该值 = 原本是空白 -> 增量绘制
additive_ink_gain   = 1.03      # 增量绘制还需满足：整体墨迹比上一状态更多（只加不减）
absorb_thin_chars   = 20        # 文字量低于该值且时长短的段，会被邻近内容页吸收
absorb_thin_max_sec = 60.0   # 薄页时长上限（放宽：动画慢的页可能持续很久）
absorb_thin_contain = 0.5       # 薄段与邻居的文本包含度下限（防止把独立的短页吞掉）
candidates_per_seg  = 6         # 每段送 OCR 的候选帧数（含首/末/最大墨迹/最清晰 + 均匀采样）
snap_to_transcript  = true      # 段边界吸附到最近的字幕句首
snap_window_sec     = 3.0
page_cut_only_cuts  = true      # 只有"硬切"（大幅帧差）才算换页，小幅变化按同页标注处理
page_cut_percentile = 0.85      # 硬切门槛：帧差分位数
page_cut_multiple   = 3.0       # 硬切门槛的辅助倍数
page_cut_lookback_sec = 1.5     # 稳定段起点前多久内出现硬切才算换页
# M4b「遮挡最少」：同页候选中挑遮挡最少的（判据数字 = 最大连通前景块占比，见 roles._occlusion）。
# **换帧默认关闭**（开关是 [roles].occlusion_swap=false，理由与逐帧证据写在 [roles] 段）；
# 下面两项只在开关打开时才生效。
occ_score_tol       = 0.10      # 只在"信息量接近"的候选之间比遮挡（打分 >= 最高分×(1-它)）；
                                #   不设这个门槛会把动画中途的不完整帧选成主图
occ_min_gain        = 0.10      # 遮挡要明显更少才值得换（占比差 >= 它；0.10 ≈ 画面 10%）
ocr_consensus       = true      # 对前两名候选各跑一次 OCR 并按行合并（降低单次识别误差）
auto_caption_strip  = true      # 自动识别烧进画面的口播字幕条并排除出稳定性判定与 OCR
caption_strip_ratio = 0.14      # 字幕条高度占画面比例（自下而上）
caption_band_multiple = 2.5     # 底部变化率相对中部倍数达到该值才判定为字幕条
scene_threshold     = 0.04      # strategy=scene 时的 ffmpeg scene 阈值（基线用）
# 幻灯片样板文字（窗口标题栏 / 页码 / 站名水印）：做"同页判定"前先剔除，否则任意两页都"很像"。
# 课程专有的页眉字样请写进 config/local.toml 的 [segment] 段。
boilerplate_patterns = [
  'pptx', 'powerpoint', '幻灯片放映', '显示器设置',
  '幻灯片第\s*\d+\s*张', '共\s*\d+\s*张', 'bilibili',
]

[ocr]
enabled        = true          # 未装 rapidocr 时自动降级为"墨迹密度"打分
engine         = "rapidocr"
min_text_chars = 8             # 少于该字数视为无文字帧
weight_chars   = 1.0           # 终态选帧打分：OCR 字数权重
weight_ink     = 30.0          # 墨迹(非背景像素)占比权重
weight_sharp   = 5.0           # 清晰度(拉普拉斯方差)权重

[bundle]
transcript_max_chars = 0       # >0 时对 transcript.md 截断（默认 0=不截断，保完整）
chapter_gap_sec      = 25.0    # 相邻 slide 间隔超过该值即视为新章节边界（供 agent 参考）
propose_chapters     = true

[merge]
# 把章节正文合并成一份可直接阅读的单文件讲义
enabled            = true
filename           = "lecture.md"
standalone         = true
standalone_filename= "lecture.standalone.md"
include_transcript = false
# 大纲样式：list+table（默认，原生渲染、天然有序）| timeline（附加 mermaid 时间线）| list
outline            = "list+table"

[note]
# 单 lecture 学习笔记：沿原视频时间轴的"关键节点 + 理解层注释"
# 定位：lecture 是视频的文字版（完整、按时间、配图）；note 是"看完这节我要带走什么"，
#       只保留关键节点，节点上挂 提炼 / 联想 / 问答 / 钩子 四类注释。
enabled            = true
filename           = "note.md"
mode               = "timeline-nodes"
min_nodes          = 6
max_nodes          = 30
head_sections      = ["本课定位", "节点索引"]
tail_sections      = ["带走三件事", "未解之问", "自测", "行动"]
field_labels       = ["提炼", "联想", "问答", "钩子"]
require_per_node   = ["提炼"]
max_ratio          = 0.20
export_hooks       = true
derive_index        = true    # 节点索引由工具从节点标题派生（agent 不写，也不占内容预算）
anchor_candidate_limit = 40  # note_brief 里「小节锚点候选」表最多列几条（超出按均匀抽样，保留首尾）
paragraph_anchor_limit = 400 # 信息流模式：note_brief 里最多列多少个段落锚点（超长视频的截断线）
glossary_terms_limit   = 20  # 注入 note_brief 的已确认术语条数上限
paragraph_preview_chars = 36 # 信息流模式：段落锚点表里每段的字幕预览字数（给写手的材料，调大更完整）
anchor_preview_chars    = 30 # 锚点候选表里"那一刻的字幕首句"预览字数

[text]
# 信息流 / 口播类（无幻灯片）模式：只用音频 + 字幕，不抽帧、不切片、不分章。
para_gap_sec     = 1.2      # 相邻字幕段间隔 >= 此值 -> 另起一段
max_para_sec     = 120.0    # 单段最长时长（秒），超过强制切
anchor_every_sec = 300.0    # 导航锚点间隔（秒）；0 = 只用段落锚点
chunk_chars      = 6000     # 每块给 writer 的字数上限（渐进式披露的块大小）
with_vision      = false    # 是否把「取样面板（画面旁证）」放进派单材料（M5；也可用 bnote stream --with-vision 显式开）
# 整理稿**正文** / 字幕正文 的下限（防摘要化）——**旁证**：只警告、不拦流程；主闸门是结构判据「每段字幕都要被某个小节覆盖」。
# 定稿依据：P25 按 0.14.0 新契约重做实测 **1.100**（同一集旧式准逐字稿 1.214 —— 书面化让正文短了约 5%）；
# 旧值 0.85 来自 12 集准逐字（合法区间 0.913~1.197，滥用案例 0.55）。取 0.70 是给「书面化 + 结构化」的合法产物留余量
# （**单集样本**，后续集再校准）；代价是只能拦住 0.55 量级的严重压缩。
min_cover_ratio  = 0.70
# 锚点走位启发式的阈值（只警告、不判错）：实测 8 字门槛会误报（P3「gent的开发和」、P8「ontology」），收紧到 12 字后假阳性消失、真阳性仍会报
anchor_drift_min_chars = 12   # 首句与更早段落的最短重合字数，低于此不提示
anchor_drift_head_chars = 40  # 只在小节首句的前 N 个字里找重合
anchor_drift_window = 3       # 往前回看多少个段落

[triage]
# M5 判型（bnote triage）：开跑前给"该走 slides 还是 stream"的建议 + 证据。
# 产物 out/<vid>/_meta/mode_hint.json（不放时间戳）。**只建议、不自动改行为**。
# T1 元信息永远跑（只打印一行到 **stderr**，不动任何命令的 stdout）；T2/T3 只在你显式 --level 时跑。
enabled            = true   # T1 那一行提示是否打印（false = 连那行也不打；bnote triage 本身不受拦）
default_level      = "t1"   # bnote triage 不带 --level 时跑到哪级
t3_tiles           = 12     # T3 取样面板的格数（相当于 bnote sheet --max）
# 下面四个是"形态分"的阈值 —— 判型只建议、不做硬阈值自动切换，所以它们只影响建议与置信
cuts_per_min_high  = 3.0    # 切点密度 ≥ 该值 → 像"离散翻页"（页式特征）
cuts_per_min_low   = 0.5    # 切点密度 ≤ 该值 → 像"几乎无硬切"（滚动/口播/实录）
freeze_ratio_page  = 0.60   # 冻结占比 ≥ 该值 → 大段静止（页式特征）
motion_mean_high   = 0.05   # 逐秒运动均值 ≥ 该值 → 画面持续在动（连续型特征）
slides_keywords    = ["课件", "幻灯片", "PPT", "讲义", "白板"]
stream_keywords    = ["访谈", "播客", "口播", "直播", "聊天", "实录", "课堂", "滚动"]

[export]
# bnote export --format bili-note：把讲义/笔记导出成"可直接粘贴进 B 站笔记"的富文本（CF_HTML）。
# 产出 out/<vid>/_meta/ 下三份文件：bili_note_<来源>.html（剪贴板格式）、同名 .md（预览）、bili_note_clip.ps1（Windows 装载）。
# 为什么有上限：B 站笔记的锚点节点（div.ql-tag-blot）**desc 上限实测是 14 个字符**，给多了节点会退化
# 成不可点；显示文本太长则整条标签被截得看不出是什么，所以也留一个。
desc_max_chars  = 14           # 锚点 data-desc（用小节标题）的字数上限，超出以「…」结尾（0 = 不截断）
title_max_chars = 30           # 锚点显示文本（<标题> P<分P> - MM:SS）里标题部分的字数上限（0 = 不截断）
title_field     = "title"      # 锚点标题取 meta.json 的哪个字段：title=视频标题（默认）｜part=分P标题
                               # 多分P课程建议改 part：视频标题常是"全 N 集"这种合集名，分P标题才说明这一讲讲什么

[loop]
# 派修循环（bnote check → brief --stage fix → fix → fix --done）
max_rounds = 2           # 轮次上限；超过即标「建议升级给人」

[prompt]
# 派单 prompt 的注入参数
desc_cap = 1500          # 视频简介注入时的截断字数（0 = 不截断）
top_comment_cap = 1000   # 置顶评论注入时的截断字数（0 = 不截断；置顶评论常带大段链接与答疑）

[manifest]
# 章节结构文件 chapters/manifest.json 的校验参数（只校验结构，不校验用词）
keypoints_min = 2
time_tolerance_sec = 1   # 时间比较容差（秒）：章界 / 小节相邻判定允许的偏差

[profile]
# 术语画像：从字幕/OCR 里挖候选术语时的停用词，以及"标题命中关键词 → 预测白名单"的领域词典
stopwords = [
  'bilibili', 'lilibili', 'bilibihi', 'bilbli', 'bilibi', 'bilibl', 'ilii',
  'http', 'https', 'www', 'com', 'cn', 'html', 'jpg', 'png',
  'the', 'and', 'for', 'one', 'two', 'you', 'our',
]

[profile.domain_lexicon]
'提示词, prompt' = ['prompt', 'zero-shot', 'few-shot', 'CoT', '思维链', '角色提示', '元提示', '提示词注入']
'rag, 检索, 知识库' = ['RAG', 'embedding', 'chunk', 'vector DB', 'rerank', '知识库', '检索增强生成', '向量']
'agent, 智能体' = ['Agent', 'function calling', 'tool calling', 'memory', 'MCP', '工作流']
'攻击, 防御, 安全, 注入' = ['prompt injection', 'jailbreak', '越狱', '纵深防御', '红队']
