[project]
name = "bnote"
version = "0.9.1"
description = "Bilibili video -> slide-segmented Markdown lecture notes pipeline"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "yt-dlp>=2024.1.0",
    "imageio-ffmpeg>=0.4.9",
    "numpy>=1.24",
    "Pillow>=10.0",
    "requests>=2.28",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
asr = ["faster-whisper>=1.0"]
ocr = ["rapidocr-onnxruntime>=1.3"]

[project.scripts]
bnote = "bnote.cli:main"

[build-system]
requires = ["setuptools>=77"]   # >=77 才支持 PEP 639 的 license 字符串与 license-files
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["bnote", "bnote.layers", "bnote.backends", "bnote.segmenters"]
